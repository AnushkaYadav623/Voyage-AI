# ============================================
# TripSync AI - Backend Configuration
# ============================================

spring:
  application:
    name: TripSync

  # ---- MySQL DataSource Configuration ----
  datasource:
    url: jdbc:mysql://localhost:3306/${DB_NAME:tripsync_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ---- JPA / Hibernate Configuration ----
  jpa:
    hibernate:
      ddl-auto: update          # auto-creates/updates tables from entities
    show-sql: true              # logs SQL queries in console (useful for development)
    properties:
      hibernate:
        format_sql: true        # formats SQL for readability
        dialect: org.hibernate.dialect.MySQLDialect

# ---- Server Configuration ----
server:
  port: 8080

# ---- Logging Configuration ----
logging:
  level:
    com.tripsync: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
